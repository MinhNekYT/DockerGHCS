name: Automated Proxmox VE on KVM

on:
  workflow_dispatch:

jobs:
  proxmox-kvm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-system-x86 qemu-utils genisoimage cloudflared p7zip-full wget curl
          
          # Chỉ cấp quyền nếu /dev/kvm tồn tại (tránh lỗi thoát chương trình)
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Generate Unattended Answer File & ISO
        run: |
          cat << 'EOF' > answer.toml
          [global]
          keyboard = "en-us"
          country = "vn"
          fqdn = "pve.lan"
          mailto = "admin@example.com"
          timezone = "Asia/Ho_Chi_Minh"
          root_password = "YourStrongPassword123"

          [network]
          source = "from-dhcp"

          [disk-setup]
          filesystem = "ext4"
          disk_list = ["vda"]
          EOF

          genisoimage -J -R -V "PROXMOX-AUTO-INSTALL" -o answer.iso answer.toml

      - name: Download Latest Proxmox ISO & Extract Kernel
        run: |
          qemu-img create -f qcow2 proxmox.qcow2 32G
          
          # Tự động lấy tên file ISO mới nhất từ trang chủ để không bao giờ bị lỗi link chết (404)
          LATEST_ISO=$(curl -s https://download.proxmox.com/iso/ | grep -o 'proxmox-ve_[0-9.]*-[0-9]*\.iso' | tail -n 1)
          echo "Đang tải phiên bản: $LATEST_ISO"
          wget -q --show-progress --no-check-certificate "https://download.proxmox.com/iso/$LATEST_ISO" -O proxmox.iso

          # Cố gắng giải nén, thêm || true để tránh crash nếu có warning từ 7z
          7z x proxmox.iso boot/linux26 boot/initrd.img -o./ || true
          mv boot/linux26 ./vmlinuz
          mv boot/initrd.img ./initrd.img
          rm -rf boot

      - name: Configure QEMU Acceleration
        run: |
          # Nếu Github Runner có hỗ trợ KVM -> dùng KVM. Nếu không -> dùng phần mềm giả lập (chậm hơn nhưng an toàn).
          if [ -e /dev/kvm ]; then
            echo "QEMU_ACCEL=-enable-kvm -cpu host" >> $GITHUB_ENV
            echo "Trạng thái ảo hóa: Hỗ trợ KVM (Tốc độ tối đa)"
          else
            echo "QEMU_ACCEL=-cpu qemu64" >> $GITHUB_ENV
            echo "Trạng thái ảo hóa: KHÔNG hỗ trợ KVM. Tự động chuyển sang chế độ Software Emulation."
          fi

      - name: Run Unattended Proxmox Installation
        run: |
          echo "=== Bắt đầu cài đặt tự động Proxmox VE (Timeout 8 phút) ==="
          
          # Truyền trực tiếp biến môi trường QEMU_ACCEL vào lệnh chạy
          timeout 8m qemu-system-x86_64 \
            ${{ env.QEMU_ACCEL }} \
            -smp 2 -m 4096 \
            -kernel vmlinuz \
            -initrd initrd.img \
            -append "proxmox-start-auto-installer console=ttyS0" \
            -drive file=proxmox.qcow2,if=virtio,format=qcow2 \
            -drive file=proxmox.iso,media=cdrom \
            -drive file=answer.iso,media=cdrom \
            -nographic \
            -no-reboot || echo "Cài đặt thành công hoặc đã đạt thời gian giới hạn."

      - name: Start Cloudflare Tunnel & Boot Proxmox VE
        run: |
          cloudflared tunnel --url https://localhost:8006 --no-tls-verify > cloudflared.log 2>&1 &
          
          echo "Đang khởi tạo đường truyền Cloudflare Tunnel..."
          URL=""
          for i in {1..30}; do
            # Bọc "|| true" để Github Actions không bị sập do Pipefail Exit Code 1 khi grep chưa tìm thấy link
            URL=$(grep -o 'https://.*\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          echo "=================================================="
          if [ -n "$URL" ]; then
            echo "TRUY CẬP PROXMOX WEB UI TẠI LINK DƯỚI ĐÂY:"
            echo "$URL"
          else
            echo "LỖI: Không lấy được Cloudflare URL. Chi tiết log:"
            cat cloudflared.log
          fi
          echo "Tài khoản: root"
          echo "Mật khẩu: YourStrongPassword123"
          echo "=================================================="

          # Khởi động chính thức vào hệ điều hành Proxmox
          qemu-system-x86_64 \
            ${{ env.QEMU_ACCEL }} \
            -smp 2 -m 4096 \
            -drive file=proxmox.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=net0,hostfwd=tcp::8006-:8006 \
            -device virtio-net-pci,netdev=net0 \
            -nographic
            
            
