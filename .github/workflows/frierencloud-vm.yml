name: FrierenCloud Linux VPS

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Linux hostname provided by FrierenCloud
        required: true
        type: string
  

jobs:
  provision-sshx:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install and run SSHX
        shell: bash
        run: |
          curl -sSf https://sshx.io/get | sh && sshx && sleep 21600
