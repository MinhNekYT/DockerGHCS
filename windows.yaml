services:
  windows:
    image: ghcr.io/dockur/windows
    environment:
      RAM_SIZE: "half"
      CPU_CORES: "max"
      DISK_SIZE: "400G"
      # Bật sound card ảo và streaming audio trong web viewer của dockur.
      AUDIO: "Y"
      USERNAME: "windowsghcs"
      PASSWORD: "123456"
      ARGUMENTS: "-drive file=/driver.iso,media=cdrom"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - /mnt:/storage
      - /mnt/custom.iso:/custom.iso:ro
      - /mnt/driver.iso:/driver.iso:ro
    stop_grace_period: 2m
